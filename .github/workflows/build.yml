name: Build FFmpeg Windows with NVENC

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          suppress-deprecation-warnings: msystem-mingw64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            yasm
            nasm
            git
            make
            diffutils
            mingw-w64-x86_64-x264
            mingw-w64-x86_64-x265
            
      - name: Download and Install NVENC Headers
        run: |
          git clone https://git.videolan.org/git/ffmpeg/nv-codec-headers.git
          cd nv-codec-headers
          make install PREFIX=/mingw64
          cd ..
          
      - name: Configure FFmpeg
        run: |
          ./configure --arch=x86_64 --target-os=mingw64 --enable-gpl --enable-nonfree --enable-libx264 --enable-libx265 --enable-nvenc
          
      - name: Compile FFmpeg
        run: make -j$(nproc)
        
      - name: Package Dependencies (DLLs)
        run: |
          mkdir ffmpeg-release
          cp ffmpeg.exe ffmpeg-release/
          # Находим все зависимости из папки mingw64/bin и копируем их рядом с exe
          ldd ffmpeg.exe | sed -n 's/.*\(\/mingw64\/bin\/[^ ]*\).*/\1/p' | xargs -I {} cp {} ffmpeg-release/
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-build-nvenc
          path: ffmpeg-release/
